<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LANDED Mill Marketplace</title>
<meta name="theme-color" content="#14222F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  calm, exact, trade-desk serious, like a mill price sheet that does the maths for you
   IDEA   a steel trading terminal where every offer shows its true landed cost, carbon included
   PICTURE the ranked offer list itself, each mill a priced lot with a score dial and a CBAM line
   COLOUR deep steel navy, cool rolled-steel blue, one hot-metal orange for default exposure
   TYPE   Space Grotesk numbers and titles, Inter text, IBM Plex Sans Thai for Thai */
:root{color-scheme:light dark;
--bg:light-dark(#F3F1EC,#0E1822);--panel:light-dark(#FFFFFF,#16232F);--ink:light-dark(#14222F,#E9EEF2);--mute:light-dark(#56636F,#9DAAB6);
--line:light-dark(#E2DDD3,#263645);--navy:#14222F;--blue:light-dark(#1F6FB2,#5FA4DE);--sky:light-dark(#DCE8F4,#1B3349);--hot:light-dark(#C4581E,#F08A4B);--hotbg:light-dark(#F8E5D9,#3A2417);
--ok:light-dark(#1F6FB2,#5FA4DE);--chip:light-dark(#EEEAE2,#1E2D3B)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,'IBM Plex Sans Thai',system-ui,sans-serif;overflow-x:clip}
html[lang=th] body{font-family:'IBM Plex Sans Thai',Inter,system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num,.sg{font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#F3F1EC;box-shadow:0 1px 0 #34495C}
.hbar{display:flex;align-items:center;gap:16px;padding:12px max(4vw,16px);max-width:1360px;margin:auto}
.logo{font:700 26px/1 'Space Grotesk',sans-serif;letter-spacing:-1px}
.logo b{color:#8FBCE6}
.tag{font-size:13px;color:#9DB3C6;border-left:1px solid #34495C;padding-left:14px}
.sp{flex:1}
.lang{display:flex;border:1px solid #34495C;border-radius:22px;padding:3px}
.lang button{border:0;background:none;color:#B9C6D2;min-height:36px;min-width:44px;border-radius:18px;font-weight:600}
.lang button.on{background:#F3F1EC;color:var(--navy)}
.cartb{display:flex;align-items:center;gap:8px;background:#1F6FB2;border:0;color:#fff;border-radius:22px;min-height:44px;padding:0 16px;font-weight:600}
.cartb .ct{background:#fff;color:#14222F;border-radius:12px;min-width:24px;padding:0 6px;font-size:13px}
.ctx{background:#1A2C3B;color:#DCE5EC}
.ctxin{max-width:1360px;margin:auto;padding:12px max(4vw,16px);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end}
.ctxin label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#9DB3C6}
.ctxin select,.ctxin input{background:#0E1A24;border:1px solid #34495C;border-radius:8px;min-height:40px;padding:0 10px;color:#F3F1EC;font-size:16px;width:150px}
.prod{display:flex;flex-direction:column;gap:2px}
.prod b{font:600 16px 'Space Grotesk','IBM Plex Sans Thai',sans-serif;color:#fff}
.prod span{font-size:12px;color:#9DB3C6}
main{max-width:1360px;margin:auto;padding:20px max(4vw,16px) 64px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--mute)}
.kpi .v{font:700 clamp(22px,2.6vw,30px)/1.1 'Space Grotesk',sans-serif;margin-top:6px}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.kpi.hot .v{color:var(--hot)}.kpi.good .v{color:var(--blue)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
aside.f{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:84px}
.fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fh b{font:600 17px 'Space Grotesk','IBM Plex Sans Thai',sans-serif}
.link{border:0;background:none;color:var(--blue);font-weight:600;min-height:36px}
.fg{border-top:1px solid var(--line);padding:12px 0}
.fg h4{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:600}
.cks{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:18px;padding:0 12px;min-height:36px;font-size:13px;user-select:none}
.ck input{position:absolute;opacity:0;width:1px;height:1px}
.ck.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ck .n{opacity:.6;font-size:12px}
.rng{width:100%;accent-color:#1F6FB2}
.rv{display:flex;justify-content:space-between;font-size:13px}
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.srch{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:44px}
.srch input{border:0;background:none;outline:0;flex:1;font-size:16px;min-height:42px}
.sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.sel select{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px;font-size:16px;color:var(--ink)}
.fbtn{display:none;min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 14px;font-weight:600}
.count{font-size:13px;color:var(--mute);margin:0 0 10px}
.spons{background:linear-gradient(90deg,var(--sky),transparent 70%);border:1px dashed var(--blue);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.spons .sl{font-size:12px;color:var(--blue);font-weight:600;margin:0 0 6px 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;margin-bottom:10px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.rk{font:700 15px 'Space Grotesk',Inter,sans-serif;color:var(--mute);text-align:center}
.dial{--p:50;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin-top:4px}
.dial span{background:var(--panel);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 17px 'Space Grotesk',Inter,sans-serif;color:var(--ink)}
.nm{font:600 17px/1.25 'Space Grotesk','IBM Plex Sans Thai',sans-serif}
.loc{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 10px}
.chip{flex:none;font-size:12px;border-radius:12px;padding:3px 9px;background:var(--chip);white-space:nowrap}
.chip.v{background:var(--sky);color:var(--blue);font-weight:600}
.chip.p{background:light-dark(#F1ECDF,#2E2A1E);color:light-dark(#7A5A12,#E2C277);font-weight:600}
.chip.d{background:var(--hotbg);color:var(--hot);font-weight:600}
.chip.sp{border:1px dashed var(--blue);background:none;color:var(--blue)}
.mets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:start}
.met .l{font-size:11.5px;color:var(--mute);line-height:1.2;min-height:2.4em}
.met .v small{display:block;font:500 11px Inter,sans-serif;color:var(--mute)}
.met .v{font:600 16px 'Space Grotesk',Inter,sans-serif;white-space:nowrap}
.met.big .v{font-size:19px}
.met .v.hot{color:var(--hot)}.met .v.ok{color:var(--blue)}
.hint{font-size:12px;color:var(--blue);margin-top:6px}
.acts{display:flex;flex-direction:column;gap:8px;width:150px}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;padding:0 14px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme=dark] .btn.pri,.btn.pri.done{background:var(--blue);border-color:var(--blue)}
.btn.done{background:var(--blue);border-color:var(--blue);color:#fff}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--mute)}
.scrim{position:fixed;inset:0;background:#0009;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--navy);color:#fff}
.dh h2{margin:0;font:600 20px/1.2 'Space Grotesk','IBM Plex Sans Thai',sans-serif;flex:1}
.x{border:0;background:#ffffff1a;color:#fff;width:44px;height:44px;border-radius:22px;font-size:20px}
.db{padding:18px 20px;overflow-y:auto;flex:1}
.df{padding:14px 20px;border-top:1px solid var(--line);background:var(--panel)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sec h3{margin:0 0 10px;font:600 15px 'Space Grotesk','IBM Plex Sans Thai',sans-serif}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;font-weight:600}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:6px 0;font-size:14px}
.dot{width:14px;height:14px;border-radius:50%;margin-top:4px;background:var(--line)}
.dot.y{background:var(--blue)}.dot.w{background:#D6A23A}.dot.n{background:var(--hot)}
.steps small{display:block;color:var(--mute);font-size:12px}
.trend{display:grid;grid-template-columns:52px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.bar i.hot{background:var(--hot)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.qty button{border:0;background:none;width:44px;height:44px;font-size:18px}
.qty input{width:64px;text-align:center;border:0;background:none;font-size:16px;font-weight:600}
.line{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.line .top{display:flex;justify-content:space-between;gap:8px}
.line .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.line select,.rfq select,.rfq textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px;font-size:16px;color:var(--ink)}
.rm{border:0;background:none;color:var(--hot);font-weight:600;min-height:44px}
.sum .kv{font-size:14px}.sum .tot dd,.sum .tot dt{font:700 18px 'Space Grotesk',Inter,sans-serif;color:var(--ink)}
.rfq label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);margin-bottom:10px}
.rfq textarea{min-height:70px;padding:10px}
.ok{text-align:center;padding:10px 0}
.ok .ref{font:700 26px 'Space Grotesk',Inter,sans-serif;color:var(--blue)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;opacity:0;transition:.2s;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:translate(-50%,0)}
details.meth{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--mute)}
details.meth summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:28px}
.demo{font-size:12px;color:var(--mute);margin-top:10px}
@media(max-width:1100px){.mets{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}
aside.f{position:fixed;top:0;left:0;bottom:0;width:min(340px,90%);z-index:50;border-radius:0;transform:translateX(-102%);transition:transform .25s;overflow-y:auto}
aside.f.on{transform:none}.fbtn{display:block}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.tag{display:none}}
@media(max-width:600px){.card{grid-template-columns:48px minmax(0,1fr);gap:12px}.acts{grid-column:1/-1;flex-direction:row;width:auto}.acts .btn{flex:1}
.dial{width:48px;height:48px}.dial span{width:38px;height:38px;font-size:15px}.ctxin select,.ctxin input{width:128px}.prod{flex-basis:100%}.logo{font-size:22px}.cartb .lbl{display:none}}
</style>
</head>
<body>
<header>
<div class="hbar">
<div class="logo">LANDED<b>.</b></div>
<div class="tag" data-i="tagline">Verified steel mill marketplace</div>
<div class="sp"></div>
<div class="lang" role="group" aria-label="Language"><button id="lEN" class="on">EN</button><button id="lTH">TH</button></div>
<button class="cartb" id="openCart" aria-label="RFQ basket"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h2l2 11h10l2-8H7"/><circle cx="10" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span class="lbl" data-i="basket">RFQ basket</span><span class="ct" id="ct">0</span></button>
</div>
</header>
<div class="ctx"><div class="ctxin">
<div class="prod"><span data-i="sourcing">Sourcing wire rod for</span><b data-i="product">Carbon steel bolts, HS 7318 15, export to EU</b></div>
<label><span data-i="year">EU import year</span><select id="yr"><option>2026</option><option>2027</option><option>2028</option><option>2030</option><option>2034</option></select></label>
<label><span data-i="vol">Your bolt output, t a year</span><input id="vol" type="number" inputmode="numeric" min="0" step="50" value="500"></label>
<label><span data-i="eua">Carbon price, € per t CO₂</span><input id="eua" type="number" inputmode="decimal" min="0" step="1" value="90"></label>
</div></div>

<main>
<section class="kpis" id="kpis"></section>
<div class="layout">
<aside class="f" id="filters" aria-label="Filters"></aside>
<section>
<div class="tb">
<button class="fbtn" id="fOpen" data-i="filters">Filters</button>
<div class="srch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" data-ph="search" placeholder="Search mill, city or grade"></div>
<label class="sel"><span data-i="sortby">Sort by</span><select id="sort"></select></label>
</div>
<p class="count" id="count"></p>
<div id="spons"></div>
<div id="list"></div>
<details class="meth"><summary data-i="methT">How LANDED scores and prices each mill</summary><div id="meth"></div></details>
<p class="demo" data-i="demo">Demo data. All mills are fictional. CBAM figures use EU default values (Implementing Regulation 2026/1740) and illustrative intensities.</p>
</section>
</div>
</main>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="detail" role="dialog" aria-modal="true" aria-labelledby="dT"><div class="dh"><h2 id="dT"></h2><button class="x" data-close aria-label="Close">×</button></div><div class="db" id="dB"></div><div class="df" id="dF"></div></div>
<div class="drawer" id="cart" role="dialog" aria-modal="true" aria-labelledby="cT"><div class="dh"><h2 id="cT" data-i="basket">RFQ basket</h2><button class="x" data-close aria-label="Close">×</button></div><div class="db" id="cB"></div><div class="df" id="cF"></div></div>
<div class="toast" id="toast" role="status"></div>

$("#list").innerHTML=v.length?v.map((m,i)=>card(m,i+1)).join(""):`<div class="empty"><p>${t("nomatch")}</p><button class="btn" id="eClr">${t("clear")}</button></div>`;
$("#ct").textContent=Object.keys(st.cart).length};
const sorts=()=>{$("#sort").innerHTML=Object.keys(SORTS).map(k=>`<option value="${k}" ${k===st.sort?"selected":""}>${t(SK[k])}</option>`).join("")};
const i18n=()=>{document.documentElement.lang=st.lang;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$("#q").placeholder=t("search");$("#meth").innerHTML=t("meth");$("#lEN").classList.toggle("on",st.lang==="en");$("#lTH").classList.toggle("on",st.lang==="th")};
const all=()=>{calc();i18n();sorts();kpis();filters();list();if($("#cart").classList.contains("on"))cartView()};
const open=id=>{$("#scrim").classList.add("on");$(id).classList.add("on")},close=()=>{document.querySelectorAll(".drawer.on,aside.f.on,.scrim.on").forEach(e=>e.classList.remove("on"))};
const toast=m=>{const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)};
let dq=50;
const detail=id=>{const m=M.find(x=>x.id===id);dq=st.cart[id]?.q||Math.max(m.moq,50);$("#dT").textContent=m.n;
const yrs=[2026,2028,2030,2034],keep=st.yr,vals=yrs.map(y=>{st.yr=y;return cbamOf(m,m.s==="v")});st.yr=keep;const mx=Math.max(...vals,1);
const trail=[[t("t1"),m.s!=="n"?"y":"n",m.s!=="n"?"":t("notup")],[t("t2"),m.s!=="n"?"y":"n",""],[t("t3"),m.s==="v"?"y":m.s==="p"?"w":"n",m.s==="v"?t("consistent"):m.s==="p"?t("pend"):t("nocheck")],[t("t4"),m.s==="v"?"y":m.s==="p"?"w":"n",m.s==="v"?m.vd:t("pend")]];
$("#dB").innerHTML=`<div class="sec"><h3>${t("ov")}</h3><dl class="kv"><dt>${t("plant")}</dt><dd>${m.city}, ${CN[m.c][st.lang]}</dd><dt>${t("cap")}</dt><dd>${m.cap}</dd><dt>${t("fob")}</dt><dd>${usd(m.p)}/t</dd><dt>${t("ship")}</dt><dd>${usd(m.f)}/t</dd><dt>${t("duty")}</dt><dd>${(m.du*100).toFixed(m.du?2:0)}%</dd><dt>${t("lead")}</dt><dd>${m.l} ${t("days")}</dd><dt>${t("moq")}</dt><dd>${m.moq} t</dd><dt>${t("otd")}</dt><dd>${m.otd}%</dd><dt>${t("terms")}</dt><dd>L/C, T/T</dd><dt>${t("inc")}</dt><dd>FOB, CFR</dd></dl></div>
<div class="sec"><h3>${t("grades")}</h3><p style="margin:0">${m.g}</p><h3 style="margin-top:12px">${t("certs")}</h3><p style="margin:0">${m.ce}</p></div>
<div class="sec"><h3>${t("trail")}</h3><ul class="steps">${trail.map(([a,c,s])=>`<li><span class="dot ${c}"></span><div>${a}${s?`<small>${s}</small>`:""}</div></li>`).join("")}</ul></div>
<div class="sec"><h3>${t("traj")}</h3>${yrs.map((y,i)=>`<div class="trend"><span>${y}</span><div class="bar"><i class="${m.s==="v"?"":"hot"}" style="width:${vals[i]/mx*100}%"></i></div><b class="num" style="text-align:right">${eur(vals[i])}</b></div>`).join("")}${m.s==="p"?`<p class="hint">${t("ifver",{v:eur(m.cbv)})}</p>`:""}</div>`;
dFoot(m)};
const dFoot=m=>{$("#dF").innerHTML=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font-size:13px;color:var(--mute)">${t("qty")}</span><div class="qty"><button data-dq="-1" aria-label="−">−</button><input id="dqi" type="number" inputmode="numeric" value="${dq}" step="${m.moq}" min="${m.moq}" aria-label="${t("qty")}"><button data-dq="1" aria-label="+">+</button></div><button class="btn pri" style="flex:1" data-dadd="${m.id}">${st.cart[m.id]?t("upd"):t("addN",{q:dq})}</button></div>`};
const months=()=>{const o=[],d=new Date(2027,0,1);for(let i=0;i<6;i++){o.push(d.toLocaleDateString(st.lang==="th"?"th-TH":"en-GB",{month:"short",year:"numeric"}));d.setMonth(d.getMonth()+1)}return o};
let sentRef=null;
const cartView=()=>{const ids=Object.keys(st.cart);if(sentRef){$("#cB").innerHTML=`<div class="ok"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1F6FB2" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m7 12 3 3 7-7"/></svg><h3 class="sg" style="font-size:22px;margin:8px 0">${t("sent")}</h3><p>${t("ref")}</p><p class="ref">${sentRef}</p><p style="color:var(--mute)">${t("sentS")}</p><div class="sec" style="text-align:left">${t("ev")}</div></div>`;$("#cF").innerHTML=`<button class="btn pri" style="width:100%" id="newRfq">${t("newb")}</button>`;return}
if(!ids.length){$("#cB").innerHTML=`<div class="empty">${t("empty")}</div>`;$("#cF").innerHTML="";return}
const mo=months();let rod=0,goods=0,cb=0,co=0;
$("#cB").innerHTML=ids.map(id=>{const m=M.find(x=>x.id===id),c=st.cart[id],bo=c.q/ROD;rod+=c.q;goods+=m.goods/ROD*c.q;cb+=m.cb*FX*bo;co+=m.co2*c.q;
return `<div class="line"><div class="top"><div><b class="sg">${m.n}</b><div class="loc">${CN[m.c][st.lang]} · ${badge(m.s)}</div></div><b class="num">${usd(m.tot*bo)}</b></div><div class="row"><div class="qty"><button data-cq="${id}" data-d="-1" aria-label="−">−</button><input data-ci="${id}" type="number" inputmode="numeric" value="${c.q}" step="${m.moq}" min="${m.moq}" aria-label="${t("qty")}"><button data-cq="${id}" data-d="1" aria-label="+">+</button></div><span style="font-size:13px;color:var(--mute)">t</span><label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)">${t("month")}<select data-cm="${id}">${mo.map((x,i)=>`<option value="${i}" ${+c.m===i?"selected":""}>${x}</option>`).join("")}</select></label><button class="rm" data-crm="${id}">${t("remove")}</button></div></div>`}).join("")+
`<div class="sec sum"><h3>${t("sum")}</h3><dl class="kv"><dt>${t("rod")}</dt><dd>${rod.toLocaleString()} t</dd><dt>${t("bolts")}</dt><dd>${Math.round(rod/ROD).toLocaleString()} t</dd><dt>${t("goods")}</dt><dd>${usd(goods)}</dd><dt>${t("cbx")}</dt><dd style="color:var(--hot)">${usd(cb)}</dd><dt>${t("avg")}</dt><dd>${(co/rod).toFixed(2)} t CO₂/t</dd><dt class="tot">${t("tot")}</dt><dd class="tot">${usd(goods+cb)}</dd></dl></div>
<form class="sec rfq" id="rfq"><label>${t("port")}<select><option>Laem Chabang</option><option>Bangkok Port</option><option>Map Ta Phut</option></select></label><label>${t("incS")}<select><option>CFR</option><option>CIF</option><option>FOB</option></select></label><label>${t("pay")}<select><option>L/C at sight</option><option>L/C 90 days</option><option>T/T 30/70</option></select></label><label>${t("note")}<textarea placeholder="${t("noteph")}"></textarea></label></form>`;
$("#cF").innerHTML=`<button class="btn pri" style="width:100%" id="sendRfq">${t("send",{n:ids.length})}</button>`};
const addCart=(id,q)=>{const m=M.find(x=>x.id===id);q=Math.max(m.moq,Math.round(q/m.moq)*m.moq||m.moq);st.cart[id]={q,m:st.cart[id]?.m||0};sentRef=null;save();list();toast(t("toastAdd"))};
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-close]");if(!b)return;const d=b.dataset;
if(d.close!==undefined||b===$("#scrim"))close();
if(b.id==="lEN"||b.id==="lTH"){st.lang=b.id==="lEN"?"en":"th";save();all();if($("#detail").classList.contains("on"))detail($("#detail")._id)}
if(b.id==="openCart"){cartView();open("#cart")}
if(b.id==="fOpen"){$("#scrim").classList.add("on");$("#filters").classList.add("on")}
if(b.id==="fReset"||b.id==="eClr"){st.cty.clear();st.rt.clear();st.ds.clear();st.ship=45;st.lead=30;st.iatf=false;st.q="";$("#q").value="";filters();list()}
if(d.det){$("#detail")._id=d.det;detail(d.det);open("#detail")}
if(d.add){if(st.cart[d.add]){delete st.cart[d.add];save();list();toast(t("toastRm"))}else addCart(d.add,Math.max(M.find(x=>x.id===d.add).moq,50))}
if(d.dq){const m=M.find(x=>x.id===$("#detail")._id);dq=Math.max(m.moq,dq+ +d.dq*m.moq);dFoot(m)}
if(d.dadd){addCart(d.dadd,dq);dFoot(M.find(x=>x.id===d.dadd))}
if(d.cq){const m=M.find(x=>x.id===d.cq);st.cart[d.cq].q=Math.max(m.moq,st.cart[d.cq].q+ +d.d*m.moq);save();cartView()}
if(d.crm){delete st.cart[d.crm];save();list();cartView();toast(t("toastRm"))}
if(b.id==="sendRfq"){sentRef="LND-27-"+String(Math.floor(1000+Math.random()*9000));st.cart={};save();list();cartView()}
if(b.id==="newRfq"){sentRef=null;cartView()}});
$("#scrim").addEventListener("click",close);
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
document.addEventListener("change",e=>{const x=e.target;
if(x.dataset.g){const s=st[x.dataset.g];x.checked?s.add(x.value):s.delete(x.value);filters();list()}
if(x.id==="iatf"){st.iatf=x.checked;filters();list()}
if(x.id==="yr"){st.yr=+x.value;st.eua=Y[st.yr].e;$("#eua").value=st.eua;all()}
if(x.id==="sort"){st.sort=x.value;list()}
if(x.dataset.cm){st.cart[x.dataset.cm].m=+x.value;save()}
if(x.dataset.ci){const m=M.find(y=>y.id===x.dataset.ci);st.cart[x.dataset.ci].q=Math.max(m.moq,Math.round(+x.value/m.moq)*m.moq);save();cartView()}
if(x.id==="dqi"){const m=M.find(y=>y.id===$("#detail")._id);dq=Math.max(m.moq,Math.round(+x.value/m.moq)*m.moq);dFoot(m)}});
document.addEventListener("input",e=>{const x=e.target;
if(x.id==="q"){st.q=x.value;list()}
if(x.id==="rShip"){st.ship=+x.value;x.nextElementSibling.lastElementChild.textContent=usd(st.ship)+"/t";list()}
if(x.id==="rLead"){st.lead=+x.value;x.nextElementSibling.lastElementChild.textContent=st.lead+" "+t("days");list()}
if(x.id==="eua"){st.eua=Math.max(0,+x.value||0);calc();kpis();list()}
if(x.id==="vol"){st.vol=Math.max(0,+x.value||0);kpis()}});
document.addEventListener("submit",e=>e.preventDefault());
all();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
}
</script>
</body>
</html>
